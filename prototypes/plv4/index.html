<body>
<header><div class="brand"><span>XYZ</span> / PL<span>V4</span><span class="version">UI STUDY · 02</span></div><span class="header-context">Prompt Library / Notebook</span><div class="header-end"><span class="prototype">交互原型 / 示例 workflow</span><button class="settings-btn" id="global-settings">⚙ &nbsp; Settings</button></div></header>
<div class="layout" id="layout"><aside id="library"><div class="library-heading"><span>Library</span><span class="eyebrow">LOCAL</span></div><input id="library-search" type="search" placeholder="搜索资料库…" aria-label="搜索资料库"><div id="library-tree"></div><div class="library-preview" id="library-preview"></div><div class="aside-note">插入到当前节点的选中 block 下方。<br>示例资料库 · 修改自动保存在浏览器</div></aside><main class="workspace" id="workspace"></main><section class="inspector" id="inspector" aria-label="Block 详细设置"></section></div>
<div id="modal" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
function block(name,text,extra={}){return {id:id(),name,enabled:true,collapsed:false,shuffle:false,format:'$p',groupWeight:1,seedLock:false,seed:0,pick:false,pickCount:1,pickMax:1,dropout:false,dropRate:.2,schedule:false,start:0,end:1,region:false,regionKind:'imask',mask:0,rect:[0,.5,0,1],maskUnit:'fraction',feather:0,maskWeight:1,condWeight:1,includeBase:false,prompts:text?text.split(',').map(t=>({id:id(),text:t.trim(),enabled:true,weight:1})):[],...extra}}
const defaults=[{id:12,name:'Character · 主体',type:'Positive prompt',blocks:[block('主体与特征','1girl, solo, silver hair, green eyes, looking at viewer'),block('服饰与细节','white linen shirt, delicate embroidery, silver necklace',{shuffle:true}),block('光线与氛围','soft natural light, golden hour, cinematic lighting, shallow depth of field',{schedule:true,start:.2,end:1}),block('背景区域','wildflowers, distant mountains, soft bokeh',{region:true,mask:0})]},{id:24,name:'Environment · 场景',type:'Positive prompt',blocks:[block('环境','a quiet garden, climbing roses, morning mist')]},{id:31,name:'Negative · 排除',type:'Negative prompt',blocks:[block('画面质量','low quality, blurry, watermark, text')]}];
defaults[0].blocks.push(block('画面与构图','upper body, centered composition, balanced framing'),block('质感','fine fabric texture, subtle film grain, detailed skin'),block('画风','illustration, painterly, soft brush strokes'),block('备选细节','floating petals, wind in hair, warm color palette',{enabled:false}));
for(const [i,name] of ['Lighting · 光线','Style · 画风','Details · 细节','Background · 背景','LoRA · 模型','Variation · 变体'].entries())defaults.push({id:40+i,name,type:'XYZ PLV4',blocks:[block(name,'soft light, detailed illustration, natural colors')]});
let state={nodes:structuredClone(defaults),node:12,selected:defaults[0].blocks[0].id,light:false,librarySelected:0,folders:{characters:true,scene:true,quality:true}};try{const saved=JSON.parse(localStorage.getItem('xyz-plv4-prototype-v2'));if(saved?.nodes?.length)state=saved}catch{}let storageWarned=false;
function save(){try{localStorage.setItem('xyz-plv4-prototype-v2',JSON.stringify(state))}catch{if(!storageWarned){storageWarned=true;toast('浏览器存储不可用，本次修改仍可继续')}}}
const current=()=>state.nodes.find(n=>n.id===state.node)||state.nodes[0], selected=()=>current().blocks.find(b=>b.id===state.selected);
function sw(checked,attrs){return `<label class="switch"><input type="checkbox" ${checked?'checked':''} ${attrs}></label>`}
function itemText(p){if(p.weight===1)return p.text;if(/^<lora:.*>$/.test(p.text))return p.text.replace(/:[-\d.]+>$/,':'+p.weight+'>');return '('+p.text+':'+p.weight+')'}
function joinItems(items){return items.reduce((s,t)=>s+(s?(/\.$/.test(s)?' ':', '):'')+t,'')}
function textOf(b){return joinItems(b.prompts.filter(p=>p.enabled).map(itemText))}
function render(){const scroll=$('.notebook')?.scrollTop||0;document.body.classList.toggle('light',state.light);renderLibrary();renderWorkspace();renderInspector();if($('.notebook'))$('.notebook').scrollTop=scroll;requestAnimationFrame(fitTabs);save()}
function renderWorkspace(){const n=current();$('#workspace').innerHTML=`<div class="nodebar"><div class="node-tabs" role="tablist" aria-label="Workflow PLV4 nodes">${state.nodes.map(x=>`<button role="tab" aria-selected="${x.id===n.id}" class="node-tab ${x.id===n.id?'active':''}" data-node="${x.id}" title="#${x.id} · ${esc(x.name)}"><span>▧</span> ${esc(x.name)}</button>`).join('')}</div><select class="overflow-menu" id="node-overflow" aria-label="更多 workflow 节点" title="更多 workflow 节点" hidden></select></div><div class="notebook-toolbar"><span><strong>Text editor</strong><span class="toolbar-divider">/</span>${esc(n.name)}</span><span class="sub">${n.blocks.length} blocks · ${n.blocks.filter(b=>b.enabled).length} enabled <span class="badge">#${n.id}</span></span></div><div class="notebook"><div id="blocks">${n.blocks.map(blockHTML).join('')}</div><button class="empty-add" data-add="last">＋ 添加 block</button><div class="canvas-note">悬停 block 底边插入 · Ctrl+B / Ctrl+I 编辑富文本</div></div>`}
function fitTabs(){const bar=$('.nodebar');if(!bar)return;const tabs=[...document.querySelectorAll('.node-tab')],over=$('#node-overflow');const max=Math.max(1,Math.floor((bar.clientWidth-46)/145));const overflow=tabs.length>max;let visible=tabs.slice(0,overflow?max:tabs.length);const active=tabs.find(t=>Number(t.dataset.node)===state.node);if(active&&!visible.includes(active)){visible[visible.length-1]=active}tabs.forEach(t=>t.hidden=!visible.includes(t));over.hidden=!overflow;over.innerHTML='<option value="">⌄</option>'+state.nodes.filter(n=>!visible.some(t=>Number(t.dataset.node)===n.id)).map(n=>`<option value="${n.id}">#${n.id} · ${esc(n.name)}</option>`).join('')}
function blockHTML(b,i){const tags=[b.shuffle?'⇄':'',b.pick?'⚄':'',b.dropout?'⚀':'',b.schedule?'◷':'',b.region?'◧':''].filter(Boolean).join(' ');return `<article class="block ${b.id===state.selected?'selected':''} ${b.enabled?'':'disabled'}" data-block="${b.id}"><div class="block-head"><div class="block-controls"><button class="icon" data-collapse="${b.id}" title="${b.collapsed?'展开':'折叠'} block" aria-expanded="${!b.collapsed}">${b.collapsed?'▸':'▾'}</button>${sw(b.enabled,`data-enable="${b.id}" aria-label="启用 ${esc(b.name)}"`)}<button class="icon" data-settings="${b.id}" title="${esc(b.name)} · 详细设置" aria-label="打开 ${esc(b.name)} 设置">⚙</button></div><div class="block-caption" title="${esc(b.name)}"><span>${String(i+1).padStart(2,'0')}</span> ${esc(b.name)}</div>${tags?`<div class="block-indicators" title="${esc([b.shuffle?'Shuffle':'',b.pick?'Random pick':'',b.dropout?'Random dropout':'',b.schedule?'Schedule':'',b.region?'Region':''].filter(Boolean).join(' / '))}">${tags}</div>`:''}</div>${b.collapsed?`<div class="collapsed-summary">${esc(textOf(b))||'空白 block'}</div>`:`<div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="${esc(b.name)} rich text editor" data-editor="${b.id}" data-placeholder="写下你的 prompt…">${esc(textOf(b))}</div>`}<div class="add-zone"><button class="add-block" data-add="${b.id}">＋ Add block</button></div></article>`}
function numberField(prop,val,min=0,max='',step=.05,label=prop){return `<input type="number" data-prop="${prop}" value="${val}" min="${min}" ${max!==''?`max="${max}"`:''} step="${step}" aria-label="${esc(label)}">`}
function row(label,control,help=''){return `<div class="setting-row"><span>${label}${help?`<small>${help}</small>`:''}</span>${control}</div>`}
function regionHTML(b){const k=b.regionKind;return `<div class="region-fields"><div class="detail-fields"><span>Kind</span><select aria-label="Region 类型" data-prop="regionKind">${['base','mask','imask','fill'].map(t=>`<option ${k===t?'selected':''}>${t}</option>`).join('')}</select></div>${k==='imask'?row('IMASK index',numberField('mask',b.mask,0,'',1),'CLIP 的 mask attach 顺序，0 起始'):''}${k==='mask'?`<div class="detail-fields"><span>坐标单位</span><select aria-label="Mask 坐标单位" data-prop="maskUnit"><option value="fraction" ${b.maskUnit==='fraction'?'selected':''}>比例 0–1</option><option value="pixels" ${b.maskUnit==='pixels'?'selected':''}>像素</option></select></div><div class="rect-fields">${['x1','x2','y1','y2'].map((t,i)=>`<label>${t}<input aria-label="Mask ${t}" type="number" data-rect="${i}" value="${b.rect[i]}" min="0" ${b.maskUnit==='fraction'?'max="1"':''} step="${b.maskUnit==='fraction'?.05:1}"></label>`).join('')}</div>`:''}${['mask','imask'].includes(k)?row('Feather · px',numberField('feather',b.feather,0,'',1)):''}${k!=='fill'?row('Mask weight',numberField('maskWeight',b.maskWeight),'重叠区域中的空间份额'):''}${row('Cond weight',numberField('condWeight',b.condWeight),'整个 region 的语义强度')}${k!=='base'?row('Include in base',sw(b.includeBase,'data-prop="includeBase" aria-label="Include in base"'),'把本 block 同时加入 base'):''}</div>`}
function renderInspector(){const b=selected(),show=!!b;$('#inspector').hidden=!show;$('#layout').classList.toggle('no-inspector',!show);if(!show)return;$('#inspector').innerHTML=`<div class="inspector-header"><div><div class="eyebrow">BLOCK SETTINGS</div><h2>${esc(b.name)}</h2></div><button class="icon" data-close-panel title="关闭设置" aria-label="关闭设置">×</button></div><div class="section"><div class="section-title">GENERAL</div>${row('Enable',sw(b.enabled,'data-prop="enabled" aria-label="Enable"'),'关闭后保留内容与位置')}${row('Group weight',numberField('groupWeight',b.groupWeight),'权重包裹整个 block')}${row('Shuffle',sw(b.shuffle,'data-prop="shuffle" aria-label="Shuffle"'),'运行时打乱 prompt 顺序')}<label class="format-label" for="format">Format <small>$p = 每条 prompt 的内容</small></label><input id="format" type="text" data-prop="format" value="${esc(b.format)}" placeholder="例如 ($p:1.05)" aria-label="Format 模板"><p class="panel-note">套用到每条 prompt，保留自身 weight 外层。</p></div><div class="section"><div class="section-title">RANDOM</div>${row('Random pick',sw(b.pick,'data-prop="pick" aria-label="Random pick"'),'随机选取固定数量或范围')}${b.pick?`<div class="detail-fields"><span>数量</span>${numberField('pickCount',b.pickCount,0,'',1,'选取数量下限')}<span>–</span>${numberField('pickMax',b.pickMax,0,'',1,'选取数量上限')}</div>`:''}${row('Random dropout',sw(b.dropout,'data-prop="dropout" aria-label="Random dropout"'),'每条 prompt 独立以此概率丢弃')}${b.dropout?`<div class="detail-fields"><span>概率</span>${numberField('dropRate',b.dropRate,0,1,.05,'丢弃概率')}<span>${Math.round(b.dropRate*100)}%</span></div>`:''}${row('Lock seed',sw(b.seedLock,'data-prop="seedLock" aria-label="Lock seed"'),'未锁定时继承节点 seed')}${b.seedLock?row('Seed',numberField('seed',b.seed,0,'',1)):''}</div><div class="section"><div class="section-title">TIMING & REGION</div>${row('Schedule',sw(b.schedule,'data-prop="schedule" aria-label="Schedule"'),'采样进度 0–1 的生效区间')}${b.schedule?`<div class="detail-fields">${numberField('start',b.start,0,1,.05,'Schedule 起点')}<span>→</span>${numberField('end',b.end,0,1,.05,'Schedule 终点')}</div>`:''}${row('Region',sw(b.region,'data-prop="region" aria-label="Region"'),'block 作为独立空间段')}${b.region?regionHTML(b):''}</div><div class="section"><div class="section-title">PROMPTS <span>${b.prompts.length}</span></div><div class="prompt-labels"><span>开关</span><span>Weight</span><span>Text</span></div><div id="prompt-list">${b.prompts.map(promptHTML).join('')}</div><button class="small-add" data-add-prompt>＋ 添加 prompt</button><p class="panel-note">关闭的 prompt 从文本隐藏，重新启用恢复原位。<br>本页展示配置交互；运行效果待接入编译器。</p></div>`}
function promptHTML(p,i){return `<div class="prompt-row ${p.enabled?'':'off'}" data-prompt="${p.id}">${sw(p.enabled,`data-prompt-prop="enabled" aria-label="启用 prompt ${i+1}"`)}<input type="number" step=".05" min="0" max="10" value="${p.weight}" data-prompt-prop="weight" aria-label="prompt ${i+1} weight"><input type="text" value="${esc(p.text)}" data-prompt-prop="text" aria-label="prompt ${i+1} text"></div>`}
const presets=[['Portrait essentials','人物基础','1girl, solo, detailed eyes, natural skin texture'],['Light studies','光线与氛围','soft natural light, rim light, golden hour'],['Botanical scenes','花园场景','wildflowers, climbing roses, lush greenery'],['Quality negative','画面排除','low quality, blurry, watermark, text']];
const folders=[{id:'characters',name:'人物 / Characters',items:[0]},{id:'scene',name:'场景与光线',items:[1,2]},{id:'quality',name:'质量与排除',items:[3]}];
function renderLibrary(){const query=$('#library-search').value.trim().toLowerCase();$('#library-tree').innerHTML=folders.map(f=>{const items=f.items.filter(i=>presets[i].join(' ').toLowerCase().includes(query));if(query&&!items.length)return '';return `<div class="library-folder"><button class="folder-toggle" data-folder="${f.id}" aria-expanded="${!!state.folders[f.id]}"><span>${state.folders[f.id]?'▾':'▸'}</span> ▱ ${f.name}<small>${items.length}</small></button><div ${!state.folders[f.id]&&!query?'hidden':''}>${items.map(i=>`<button class="library-item ${state.librarySelected===i?'active':''}" data-library="${i}"><span>▤</span><span>${presets[i][1]}<small>${presets[i][0]}</small></span><small>${presets[i][2].split(',').length}</small></button>`).join('')}</div></div>`}).join('')||'<p class="sub" style="padding:12px">没有匹配的资料库组</p>';const p=presets[state.librarySelected||0];$('#library-preview').innerHTML=`<div class="eyebrow">GROUP PREVIEW</div><h3>${p[1]}</h3><p>${p[2]}</p><button class="primary" data-preset="${state.librarySelected||0}">＋ 插入为 block</button>`}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,2500)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.node){state.node=Number(t.dataset.node);state.selected=current().blocks[0]?.id;render()}else if(t.dataset.folder){state.folders[t.dataset.folder]=!state.folders[t.dataset.folder];renderLibrary();save()}else if(t.dataset.library!==undefined){state.librarySelected=Number(t.dataset.library);renderLibrary();save()}else if(t.dataset.collapse){const b=current().blocks.find(b=>b.id===t.dataset.collapse);b.collapsed=!b.collapsed;render()}else if(t.dataset.settings){state.selected=t.dataset.settings;render()}else if(t.hasAttribute('data-close-panel')){state.selected=null;render()}else if(t.dataset.add){const b=block('空白 block','');const index=t.dataset.add==='last'?current().blocks.length:current().blocks.findIndex(b=>b.id===t.dataset.add)+1;current().blocks.splice(index,0,b);state.selected=b.id;render();const el=document.querySelector(`[data-editor="${b.id}"]`);el.focus();el.scrollIntoView({block:'nearest'})}else if(t.hasAttribute('data-add-prompt')){selected().prompts.push({id:id(),text:'',enabled:true,weight:1});render();$('#prompt-list .prompt-row:last-child input[type=text]').focus()}else if(t.dataset.preset!==undefined){const p=presets[Number(t.dataset.preset)],b=block(p[1],p[2]);const at=current().blocks.findIndex(x=>x.id===state.selected);current().blocks.splice(at<0?current().blocks.length:at+1,0,b);state.selected=b.id;render();toast('已插入 '+current().name)}else if(t.id==='global-settings'){openSettings()}else if(t.hasAttribute('data-close-modal'))closeModal();else if(t.id==='reset-demo'){state={nodes:structuredClone(defaults),node:12,selected:defaults[0].blocks[0].id,light:state.light,librarySelected:0,folders:{characters:true,scene:true,quality:true}};render();closeModal();toast('示例已重置')}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='node-overflow'){if(!t.value)return;state.node=Number(t.value);state.selected=current().blocks[0]?.id;render()}else if(t.dataset.rect){const b=selected(),i=Number(t.dataset.rect);b.rect[i]=Math.max(0,Math.min(b.maskUnit==='fraction'?1:Infinity,Number(t.value)||0));if(b.rect[i%2?i-1:i]>b.rect[i%2?i:i+1])b.rect[i%2?i-1:i+1]=b.rect[i];render()}else if(t.dataset.enable){current().blocks.find(b=>b.id===t.dataset.enable).enabled=t.checked;render()}else if(t.dataset.prop){if(t.dataset.prop==='format')return;const b=selected(),p=t.dataset.prop;b[p]=t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value;if(['start','end'].includes(p)){b[p]=Math.max(0,Math.min(1,b[p]));if(b.start>b.end)b[p==='start'?'end':'start']=b[p]}if(['pickCount','pickMax'].includes(p)){b[p]=Math.max(0,Math.round(b[p]));if(b.pickCount>b.pickMax)b[p==='pickCount'?'pickMax':'pickCount']=b[p]}if(p==='dropRate')b[p]=Math.max(0,Math.min(1,b[p]));if(['feather','seed'].includes(p))b[p]=Math.max(0,Math.round(b[p]));if(['groupWeight','maskWeight','condWeight'].includes(p))b[p]=Math.max(0,b[p]);if(p==='maskUnit')b.rect=b.maskUnit==='fraction'?[0,.5,0,1]:[0,256,0,512];if(p==='mask')b[p]=Math.max(0,Math.round(b[p]));render()}else if(t.dataset.promptProp){if(t.dataset.promptProp==='text')return;const p=selected().prompts.find(p=>p.id===t.closest('[data-prompt]').dataset.prompt);p[t.dataset.promptProp]=t.type==='checkbox'?t.checked:t.type==='text'?t.value:Math.max(0,Math.min(10,Number(t.value)));render()}else if(t.id==='light-mode'){state.light=t.checked;document.body.classList.toggle('light',state.light);save()}});
function splitPrompts(text){const out=[];let start=0,depth=0;for(let i=0;i<text.length;i++){if(text.charCodeAt(i)===92){i++;continue}if('([{<'.includes(text[i]))depth++;if(')]}>'.includes(text[i]))depth=Math.max(0,depth-1);if(depth===0&&(text[i]===','||(text[i]==='.'&&(i===text.length-1||/\s/.test(text[i+1]))))){const end=text[i]==='.'?i+1:i;const t=text.slice(start,end).trim();if(t)out.push(t);start=i+1}}const tail=text.slice(start).trim();if(tail)out.push(tail);return out}
function parseItem(text){const m=text.match(/^\((.*):(-?\d+(?:\.\d+)?)\)$/s);const l=text.match(/^<lora:.*:([-\d.]+)>$/);return {text:m?m[1]:text,weight:m?Number(m[2]):l?Number(l[1]):1}}
function syncEditor(b,text){const enabled=b.prompts.filter(p=>p.enabled),used=new Set();const next=splitPrompts(text).map((t,i)=>{const data=parseItem(t);let old=enabled.find(p=>!used.has(p.id)&&p.text===data.text)||enabled[i];if(old&&used.has(old.id))old=null;if(old)used.add(old.id);return {...old,...data,id:old?.id||id(),enabled:true}});b.prompts.forEach((p,i)=>{if(!p.enabled)next.splice(Math.min(i,next.length),0,p)});b.prompts=next}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='library-search'){renderLibrary()}else if(t.dataset.prop==='format'){selected().format=t.value;save()}else if(t.dataset.editor){const b=current().blocks.find(b=>b.id===t.dataset.editor);b.richHTML=t.innerHTML;syncEditor(b,t.innerText.replace(/\r/g,''));if(b.id===state.selected)renderInspector();save()}else if(t.dataset.promptProp==='text'){const b=selected();b.prompts.find(p=>p.id===t.closest('[data-prompt]').dataset.prompt).text=t.value;delete b.richHTML;const ed=document.querySelector(`[data-editor="${b.id}"]`);if(ed)ed.textContent=textOf(b);save()}});
// Restore only basic rich-text formatting; never inject arbitrary saved markup.
function restoreRich(){for(const b of current().blocks){const el=document.querySelector(`[data-editor="${b.id}"]`);if(!el||!b.richHTML)continue;const doc=new DOMParser().parseFromString(b.richHTML,'text/html');const safe=n=>n.nodeType===3?document.createTextNode(n.textContent):(()=>{const out=document.createElement(['B','STRONG','I','EM','U','BR','DIV','P'].includes(n.nodeName)?n.nodeName:'span');for(const c of n.childNodes)out.append(safe(c));return out})();if(doc.body.textContent.replace(/\s/g,'')===textOf(b).replace(/\s/g,''))el.replaceChildren(...Array.from(doc.body.childNodes,safe))}}
const originalRenderWorkspace=renderWorkspace;renderWorkspace=function(){originalRenderWorkspace();restoreRich()};
let previousFocus;function openSettings(){previousFocus=document.activeElement;$('#modal').hidden=false;$('#modal').className='modal-backdrop';$('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="modal-head"><h2 id="settings-title">XYZ Settings</h2><button class="icon" data-close-modal aria-label="关闭 XYZ Settings">×</button></div><div class="eyebrow">APPEARANCE</div><div class="setting-row"><span>浅色界面</span>${sw(state.light,'id="light-mode" aria-label="浅色界面"')}</div><p>这里预留 XYZ 的全局设置。当前版本用于确认窗口、block 和详细设置的交互布局。</p><div class="setting-row"><span>重新载入示例数据</span><button class="settings-btn" id="reset-demo">重置示例</button></div><p>Shuffle、随机选取、Schedule、Region 目前用于展示配置状态，尚未连接 prompt 编译。</p><button class="primary" data-close-modal style="width:100%;margin-top:15px">完成</button></div>`;$('#modal button').focus()}
function closeModal(){$('#modal').hidden=true;previousFocus?.focus()}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const all=Array.from($('#modal').querySelectorAll('button,input,select'));const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});new ResizeObserver(()=>fitTabs()).observe($('#workspace'));render();
</script>
